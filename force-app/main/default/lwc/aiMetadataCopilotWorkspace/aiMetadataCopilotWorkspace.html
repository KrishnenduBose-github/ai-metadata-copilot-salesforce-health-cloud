<template>
    <div class="app-root">
        <header class="header">
            <div class="header-brand">
                <span class="header-logo">Metadata Copilot</span>
                <template if:true={healthStatus}>
                    <span class="header-health">{healthSummary}</span>
                </template>
            </div>
            <div class="header-actions">
                <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh" variant="bare" onclick={loadHealthStatus}></lightning-button-icon>
            </div>
        </header>

        <template if:true={errorMessage}>
            <div class="alert alert-error">{errorMessage}</div>
        </template>

        <template if:true={refreshResult}>
            <div class={refreshStatusClass}>
                <strong>{refreshSummary}</strong>
                <template if:true={refreshWarning}>
                    <span class="alert-detail">{refreshWarning}</span>
                </template>
            </div>
        </template>

        <lightning-tabset active-tab-value={activeTab} onactive={handleTabChange}>
            <lightning-tab label="Search" value="search">
                <div class="panel">
                    <p class="panel-desc">Find where fields, objects, flows, or Apex are used across metadata.</p>
                    <div class="feature-guide">
                        <lightning-icon icon-name="utility:search" size="x-small" alternative-text="Search"></lightning-icon>
                        <span><strong>Find references.</strong> Search shows the direct places this item is used.</span>
                        <lightning-helptext content="Search returns direct indexed references. Impact expands the connections between them."></lightning-helptext>
                    </div>

                    <lightning-radio-group
                        label="Search Mode"
                        options={modeOptions}
                        value={searchMode}
                        type="button"
                        onchange={handleSearchModeChange}
                    ></lightning-radio-group>

                    <template if:true={isSearchSimple}>
                        <div class="input-row">
                            <lightning-combobox
                                label="Query Type"
                                data-field="searchQueryType"
                                value={searchQueryType}
                                options={queryTypeOptions}
                                onchange={handleSearchQueryTypeChange}
                            ></lightning-combobox>
                            <lightning-input
                                label="API Name"
                                data-field="searchQueryText"
                                value={searchQueryText}
                                onchange={handleSearchQueryTextChange}
                                placeholder="Account.CustomerPriority__c"
                            ></lightning-input>
                            <lightning-button label="Search" variant="brand" onclick={handleSearch} disabled={isLoading} class="btn-action"></lightning-button>
                        </div>
                    </template>

                    <div class="filter-panel">
                        <div>
                            <span class="filter-label">Source type</span>
                            <lightning-checkbox-group
                                data-field="searchSourceMetadataTypes"
                                options={searchSourceFilterOptions}
                                value={searchSourceMetadataTypes}
                                onchange={handleSearchSourceTypeChange}
                            ></lightning-checkbox-group>
                        </div>
                        <div>
                            <span class="filter-label">Relationship</span>
                            <lightning-checkbox-group
                                data-field="searchUsageTypes"
                                options={searchUsageFilterOptions}
                                value={searchUsageTypes}
                                onchange={handleSearchUsageTypeChange}
                            ></lightning-checkbox-group>
                        </div>
                        <div class="coverage-note">
                            <strong>Indexed coverage</strong>
                            <span>{indexedCoverageText}</span>
                            <small>Filters appear only for metadata currently in the catalog.</small>
                        </div>
                    </div>

                    <template if:false={isSearchSimple}>
                        <div class="input-row">
                            <lightning-textarea
                                label="Ask a question"
                                data-field="searchPrompt"
                                value={searchPrompt}
                                onchange={handleSearchPromptChange}
                                placeholder="Where is Patient_Status__c used?"
                            ></lightning-textarea>
                            <lightning-button label="Search" variant="brand" onclick={handleSearch} disabled={isLoading} class="btn-action"></lightning-button>
                        </div>
                    </template>

                    <template if:true={searchResponse}>
                        <div class="card">
                            <span class="badge">{searchResponse.severity}</span>
                            <span class="card-summary">{searchResponse.summary}</span>
                        </div>
                    </template>

                    <template if:true={searchInterpretation}>
                        <div class="interpretation-banner">{searchInterpretationText}</div>
                    </template>

                    <template if:true={hasSearchResults}>
                        <lightning-datatable key-field="usageId" data={searchResponse.matchedComponents} columns={searchColumns} hide-checkbox-column></lightning-datatable>
                    </template>

                    <template if:true={searchResponse}>
                        <template if:false={hasSearchResults}>
                            <div class="empty-state">No matching relationships. Try a different API name or refresh metadata.</div>
                        </template>
                    </template>
                </div>
            </lightning-tab>

            <lightning-tab label="Impact" value="impact">
                <div class="panel">
                    <p class="panel-desc">Understand what breaks before changing metadata.</p>
                    <div class="feature-guide feature-guide-impact">
                        <lightning-icon icon-name="utility:hierarchy" size="x-small" alternative-text="Dependency graph"></lightning-icon>
                        <span><strong>Explore connections.</strong> Impact starts at your target and expands the dependency chain.</span>
                        <lightning-helptext content="Solid relationships are indexed evidence. Use the graph to inspect connected automation, code, and security items."></lightning-helptext>
                    </div>

                    <lightning-radio-group
                        label="Impact Mode"
                        options={modeOptions}
                        value={impactMode}
                        type="button"
                        onchange={handleImpactModeChange}
                    ></lightning-radio-group>

                    <template if:true={isImpactSimple}>
                        <div class="input-row">
                            <lightning-combobox
                                label="Query Type"
                                data-field="impactQueryType"
                                value={impactQueryType}
                                options={queryTypeOptions}
                                onchange={handleImpactQueryTypeChange}
                            ></lightning-combobox>
                            <lightning-input
                                label="API Name"
                                data-field="impactQueryText"
                                value={impactQueryText}
                                onchange={handleImpactQueryTextChange}
                                placeholder="Account.CustomerPriority__c"
                            ></lightning-input>
                            <lightning-button label="Analyze" variant="brand" onclick={handleImpact} disabled={isLoading} class="btn-action"></lightning-button>
                        </div>
                    </template>

                    <div class="graph-controls">
                        <lightning-combobox label="Depth" value={impactDepth} options={impactDepthOptions} onchange={handleImpactDepthChange}></lightning-combobox>
                        <lightning-combobox label="Direction" value={impactDirection} options={impactDirectionOptions} onchange={handleImpactDirectionChange}></lightning-combobox>
                        <lightning-checkbox-group label="Metadata types" options={indexedMetadataTypes} value={impactMetadataTypes} onchange={handleImpactMetadataTypeChange}></lightning-checkbox-group>
                        <lightning-input type="checkbox" label="Hide text matches" checked={hideLowConfidence} onchange={handleHideLowConfidenceChange}></lightning-input>
                        <lightning-button label="Apply graph view" variant="neutral" onclick={handleApplyGraphSettings} disabled={isLoading}></lightning-button>
                    </div>

                    <template if:false={isImpactSimple}>
                        <div class="input-row">
                            <lightning-textarea
                                label="Ask a question"
                                data-field="impactPrompt"
                                value={impactPrompt}
                                onchange={handleImpactPromptChange}
                                placeholder="If I rename Contact.Email what breaks?"
                            ></lightning-textarea>
                            <lightning-button label="Analyze" variant="brand" onclick={handleImpact} disabled={isLoading} class="btn-action"></lightning-button>
                        </div>
                    </template>

                    <template if:true={impactResponse}>
                        <div class="card">
                            <span class="badge">{impactResponse.severity}</span>
                            <span class="card-summary">{impactResponse.summary}</span>
                        </div>
                    </template>

                    <template if:true={impactInterpretation}>
                        <div class="interpretation-banner">{impactInterpretationText}</div>
                    </template>

                    <template if:true={hasImpactGraph}>
                        <div class="graph-summary">
                            <span><strong>{impactGraph.directDependencyCount}</strong> direct</span>
                            <span><strong>{impactGraph.transitiveDependencyCount}</strong> transitive</span>
                            <span><strong>{impactGraph.edges.length}</strong> relationships</span>
                        </div>
                        <div class="graph-legend" aria-label="Graph legend">
                            <span><i class="legend-line legend-solid"></i> Structured dependency</span>
                            <span><i class="legend-line legend-dashed"></i> Indexed text match</span>
                            <span><i class="legend-line legend-dotted"></i> Inferred</span>
                        </div>
                        <div class="graph-board">
                            <template for:each={graphLevels} for:item="level">
                                <section class="graph-level" key={level.depth}>
                                    <span class="graph-level-label">{level.label}</span>
                                    <div class="graph-node-list">
                                        <template for:each={level.nodes} for:item="node">
                                            <button class="graph-node" data-key={node.key} key={node.key} onclick={handleGraphNodeClick} title="Open dependency details">
                                                <span class="graph-node-type">{node.category}</span>
                                                <strong>{node.label}</strong>
                                                <span>{node.metadataType} · {node.direction}</span>
                                            </button>
                                        </template>
                                    </div>
                                </section>
                            </template>
                        </div>
                        <div class="graph-connections" aria-label="Dependency relationships">
                            <span class="graph-connections-label">Relationships</span>
                            <template for:each={graphEdges} for:item="edge">
                                <button class="graph-edge" data-key={edge.sourceKey} key={edge.key} onclick={handleGraphNodeClick} title="Open the source node details">
                                    <span>{edge.sourceLabel}</span>
                                    <strong> {edge.relationshipType} -&gt; </strong>
                                    <span>{edge.targetLabel}</span>
                                </button>
                            </template>
                        </div>
                        <template if:true={hasSelectedGraphNode}>
                            <aside class="node-details">
                                <div class="node-details-heading">
                                    <div>
                                        <span class="eyebrow">Selected dependency</span>
                                        <h3>{selectedGraphNode.label}</h3>
                                    </div>
                                    <lightning-button-icon icon-name="utility:close" alternative-text="Close details" title="Close details" onclick={handleGraphNodeClick}></lightning-button-icon>
                                </div>
                                <dl class="node-detail-list">
                                    <div><dt>API name</dt><dd>{selectedGraphNode.apiName}</dd></div>
                                    <div><dt>Type</dt><dd>{selectedGraphNode.metadataType}</dd></div>
                                    <div><dt>Category</dt><dd>{selectedGraphNode.category}</dd></div>
                                    <div><dt>Direction</dt><dd>{selectedGraphNodeDirection}</dd></div>
                                    <div><dt>Confidence</dt><dd>{selectedGraphNode.confidence}</dd></div>
                                    <div><dt>Evidence</dt><dd>{selectedGraphNode.evidence}</dd></div>
                                </dl>
                                <div class="node-details-actions">
                                    <lightning-button label="Open in Search" variant="neutral" onclick={handleOpenGraphNodeInSearch}></lightning-button>
                                    <lightning-button label="Expand from here" variant="brand" onclick={handleExpandGraphNode}></lightning-button>
                                </div>
                            </aside>
                        </template>
                        <template if:true={impactGraph.warnings}>
                            <div class="graph-warning">{impactGraph.warnings}</div>
                        </template>
                    </template>

                    <template if:true={impactResponse}>
                        <template if:false={hasImpactResults}>
                            <div class="empty-state">No dependencies found. Refresh metadata for current results.</div>
                        </template>
                    </template>
                </div>
            </lightning-tab>

            <lightning-tab label="Security" value="security">
                <div class="panel">
                    <p class="panel-desc">Check field and object access across profiles and permission sets.</p>

                    <div class="input-row">
                        <lightning-textarea
                            label="Field, object, or question"
                            data-field="securityPrompt"
                            value={securityPrompt}
                            onchange={handleSecurityPromptChange}
                            placeholder="Patient_Status__c  /  Who can access Contact.Email?  /  Account.CustomerPriority__c"
                        ></lightning-textarea>
                        <lightning-button label="Audit" variant="brand" onclick={handleSecurity} disabled={isLoading} class="btn-action"></lightning-button>
                    </div>

                    <p class="help-text">Enter a field name (e.g. <code>Patient_Status__c</code>), an object (e.g. <code>Account</code>), Object.Field syntax, or a natural language question.</p>

                    <template if:true={securityResponse}>
                        <div class="card">
                            <span class="badge">{securityResponse.severity}</span>
                            <span class="card-summary">{securityResponse.summary}</span>
                        </div>
                    </template>

                    <template if:true={hasSecurityResults}>
                        <lightning-datatable key-field="summary" data={securityResponse.findings} columns={securityColumns} hide-checkbox-column></lightning-datatable>
                    </template>

                    <template if:true={securityResponse}>
                        <template if:false={hasSecurityResults}>
                            <div class="empty-state">No access findings for this scope. The field may not be classified as sensitive.</div>
                        </template>
                    </template>
                </div>
            </lightning-tab>

            <lightning-tab label="Deploy" value="deployment">
                <div class="panel panel-cols">
                    <div class="deploy-intro full">
                        <div>
                            <p class="eyebrow">Release readiness</p>
                            <h2>Compare a known baseline with the current org state</h2>
                            <p class="panel-desc">Set a baseline once, make your metadata changes, then capture and compare the current state.</p>
                        </div>
                        <div class="deploy-status">{deploymentStateMessage}</div>
                    </div>

                    <lightning-input label="Baseline label" value={baselineLabel} onchange={handleBaselineLabelChange}></lightning-input>
                    <lightning-input label="Current snapshot label" value={currentSnapshotLabel} onchange={handleCurrentSnapshotLabelChange}></lightning-input>
                    <div class="deploy-actions full">
                        <lightning-button label="Set baseline" variant="brand" onclick={handleSetBaseline} disabled={isLoading}></lightning-button>
                        <lightning-button label="Capture current + compare" variant="brand-outline" onclick={handleCaptureCurrentAndCompare} disabled={isLoading}></lightning-button>
                    </div>

                    <template if:true={hasDeploymentSnapshots}>
                        <div class="snapshot-picker">
                            <lightning-combobox label="Baseline snapshot" value={selectedBaselineKey} options={deploymentSnapshotOptions} onchange={handleBaselineChange}></lightning-combobox>
                            <lightning-combobox label="Current snapshot" value={selectedTargetKey} options={deploymentSnapshotOptions} onchange={handleTargetSnapshotChange}></lightning-combobox>
                            <lightning-button label="Compare selected" variant="neutral" onclick={handleDeploymentCompare} disabled={isLoading} class="btn-action"></lightning-button>
                        </div>
                    </template>

                    <template if:true={hasDeploymentSnapshots}>
                        <div class="release-timeline full">
                            <template for:each={deploymentSnapshots} for:item="snapshot">
                                <div class="timeline-item" key={snapshot.snapshotKey}>
                                    <span class="timeline-dot"></span>
                                    <div>
                                        <strong>{snapshot.label}</strong>
                                        <span>{snapshot.componentCount} indexed components</span>
                                        <small>{snapshot.capturedOn}</small>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template if:true={deploymentResponse}>
                        <div class="card full">
                            <span class="badge">{deploymentResponse.severity}</span>
                            <span>Readiness: <strong>{deploymentResponse.readinessScore}</strong></span>
                            <span>Added: <strong>{deploymentResponse.addedCount}</strong></span>
                            <span>Removed: <strong>{deploymentResponse.removedCount}</strong></span>
                            <span>Changed: <strong>{deploymentResponse.changedCount}</strong></span>
                            <span class="card-summary">{deploymentResponse.summary}</span>
                        </div>
                    </template>

                    <template if:true={hasDeploymentResults}>
                        <lightning-datatable key-field="metadataKey" data={deploymentResponse.findings} columns={deploymentColumns} hide-checkbox-column class="full"></lightning-datatable>
                    </template>
                </div>
            </lightning-tab>

            <lightning-tab label="Optimize" value="optimization">
                <div class="panel">
                    <p class="panel-desc">Scan for unused fields, duplicate flows, hardcoded IDs, and risky triggers.</p>
                    <lightning-button label="Run Scan" variant="brand" onclick={handleOptimization} disabled={isLoading}></lightning-button>

                    <template if:true={optimizationResponse}>
                        <div class="card">
                            <span class="badge">{optimizationResponse.severity}</span>
                            <span class="card-summary">{optimizationResponse.summary}</span>
                        </div>
                    </template>

                    <template if:true={hasOptimizationResults}>
                        <lightning-datatable key-field="metadataKey" data={optimizationResponse.findings} columns={optimizationColumns} hide-checkbox-column></lightning-datatable>
                    </template>
                </div>
            </lightning-tab>

            <lightning-tab label="Admin" value="admin">
                <div class="panel">
                    <p class="panel-desc">System diagnostics, refresh, and setup.</p>

                    <div class="admin-row">
                        <lightning-button label="Refresh Metadata" variant="brand" onclick={handleRefresh} disabled={isLoading}></lightning-button>
                        <lightning-button label="Check Health" variant="neutral" onclick={loadHealthStatus}></lightning-button>
                    </div>

                    <template if:true={healthStatus}>
                        <div class="stats-grid">
                            <div class="stat-cell">
                                <span class="stat-num">{healthStatus.indexedItemCount}</span>
                                <span class="stat-label">Indexed</span>
                            </div>
                            <div class="stat-cell">
                                <span class="stat-num">{healthStatus.usageRecordCount}</span>
                                <span class="stat-label">Relationships</span>
                            </div>
                            <div class="stat-cell">
                                <span class="stat-num">{healthStatus.snapshotCount}</span>
                                <span class="stat-label">Snapshots</span>
                            </div>
                        </div>

                        <template if:true={healthStatus.warnings}>
                            <template for:each={healthStatus.warnings} for:item="warn">
                                <div class="alert alert-warn" key={warn}>{warn}</div>
                            </template>
                        </template>

                        <template if:true={healthStatus.recommendations}>
                            <ul class="setup-list">
                                <template for:each={healthStatus.recommendations} for:item="rec">
                                    <li key={rec}>{rec}</li>
                                </template>
                            </ul>
                        </template>
                    </template>

                    <div class="setup-box">
                        <strong>Setup checklist</strong>
                        <ul class="setup-list">
                            <li>Configure Named Credential <code>SalesforceTooling</code></li>
                            <li>Verify <code>Agent_Action_Config__mdt</code> records</li>
                            <li>Add <code>Sensitive_Field_Rule__mdt</code> for PHI fields</li>
                            <li>Check <code>Environment_Connection__mdt</code> for compare targets</li>
                        </ul>
                    </div>
                </div>
            </lightning-tab>
        </lightning-tabset>
    </div>
</template>
