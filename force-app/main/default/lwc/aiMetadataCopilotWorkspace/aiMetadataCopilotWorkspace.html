<template>
    <lightning-card title="AI Metadata Copilot" icon-name="standard:bot">
        <div class="workspace">
            <div class="workspace-actions">
                <lightning-button
                    label="Refresh Metadata Core"
                    variant="brand"
                    onclick={handleRefresh}
                    disabled={isLoading}
                ></lightning-button>
            </div>

            <template if:true={refreshMessage}>
                <div class="banner success-banner">{refreshMessage}</div>
            </template>

            <template if:true={errorMessage}>
                <div class="banner error-banner">{errorMessage}</div>
            </template>

            <lightning-tabset active-tab-value={activeTab} onactive={handleTabChange}>
                <lightning-tab label="Search Workspace" value="search">
                    <div class="tab-panel">
                        <lightning-textarea
                            label="Ask a metadata question"
                            value={searchPrompt}
                            onchange={handleSearchPromptChange}
                            placeholder="Where is Patient_Status__c used?"
                        ></lightning-textarea>
                        <lightning-button
                            label="Run Metadata Search"
                            variant="brand-outline"
                            onclick={handleSearch}
                            disabled={isLoading}
                        ></lightning-button>
                        <template if:true={searchResponse}>
                            <div class="summary-box">
                                <p><strong>Severity:</strong> {searchResponse.severity}</p>
                                <p><strong>Summary:</strong> {searchResponse.summary}</p>
                                <p><strong>Explanation:</strong> {searchResponse.explanation}</p>
                            </div>
                            <lightning-datatable
                                key-field="metadataKey"
                                data={searchResponse.matchedComponents}
                                columns={searchColumns}
                                hide-checkbox-column
                            ></lightning-datatable>
                        </template>
                    </div>
                </lightning-tab>

                <lightning-tab label="Impact Analysis Workspace" value="impact">
                    <div class="tab-panel">
                        <lightning-textarea
                            label="Ask an impact question"
                            value={impactPrompt}
                            onchange={handleImpactPromptChange}
                            placeholder="If I rename Contact.Email what breaks?"
                        ></lightning-textarea>
                        <lightning-button
                            label="Analyze Impact"
                            variant="brand-outline"
                            onclick={handleImpact}
                            disabled={isLoading}
                        ></lightning-button>
                        <template if:true={impactResponse}>
                            <div class="summary-box">
                                <p><strong>Severity:</strong> {impactResponse.severity}</p>
                                <p><strong>Summary:</strong> {impactResponse.summary}</p>
                                <p><strong>Explanation:</strong> {impactResponse.explanation}</p>
                            </div>
                            <lightning-datatable
                                key-field="metadataKey"
                                data={impactResponse.impactedComponents}
                                columns={searchColumns}
                                hide-checkbox-column
                            ></lightning-datatable>
                        </template>
                    </div>
                </lightning-tab>

                <lightning-tab label="Security Audit Workspace" value="security">
                    <div class="tab-panel">
                        <lightning-textarea
                            label="Ask a security audit question"
                            value={securityPrompt}
                            onchange={handleSecurityPromptChange}
                            placeholder="Who can access Member__c sensitive fields?"
                        ></lightning-textarea>
                        <lightning-button
                            label="Run Security Audit"
                            variant="brand-outline"
                            onclick={handleSecurity}
                            disabled={isLoading}
                        ></lightning-button>
                        <template if:true={securityResponse}>
                            <div class="summary-box">
                                <p><strong>Severity:</strong> {securityResponse.severity}</p>
                                <p><strong>Summary:</strong> {securityResponse.summary}</p>
                                <p><strong>Explanation:</strong> {securityResponse.explanation}</p>
                            </div>
                            <lightning-datatable
                                key-field="summary"
                                data={securityResponse.findings}
                                columns={securityColumns}
                                hide-checkbox-column
                            ></lightning-datatable>
                        </template>
                    </div>
                </lightning-tab>

                <lightning-tab label="Deployment Assistant Workspace" value="deployment">
                    <div class="tab-panel two-column">
                        <lightning-input
                            label="Source Environment"
                            value={sourceEnvironment}
                            onchange={handleSourceEnvironmentChange}
                        ></lightning-input>
                        <lightning-input
                            label="Target Environment"
                            value={targetEnvironment}
                            onchange={handleTargetEnvironmentChange}
                        ></lightning-input>
                        <lightning-button
                            label="Compare Environments"
                            variant="brand-outline"
                            onclick={handleDeploymentCompare}
                            disabled={isLoading}
                        ></lightning-button>
                        <template if:true={deploymentResponse}>
                            <div class="summary-box full-width">
                                <p><strong>Severity:</strong> {deploymentResponse.severity}</p>
                                <p><strong>Readiness Score:</strong> {deploymentResponse.readinessScore}</p>
                                <p><strong>Summary:</strong> {deploymentResponse.summary}</p>
                                <p><strong>Explanation:</strong> {deploymentResponse.explanation}</p>
                            </div>
                            <lightning-datatable
                                key-field="metadataKey"
                                data={deploymentResponse.findings}
                                columns={deploymentColumns}
                                hide-checkbox-column
                            ></lightning-datatable>
                        </template>
                    </div>
                </lightning-tab>

                <lightning-tab label="Documentation Generator Workspace" value="documentation">
                    <div class="tab-panel two-column">
                        <lightning-input
                            label="Metadata Key"
                            value={documentationMetadataKey}
                            onchange={handleDocumentationMetadataKeyChange}
                            placeholder="CustomField:Account.CustomerPriority__c"
                        ></lightning-input>
                        <lightning-combobox
                            label="Request Type"
                            value={documentationRequestType}
                            options={documentationTypeOptions}
                            onchange={handleDocumentationTypeChange}
                        ></lightning-combobox>
                        <lightning-button
                            label="Generate Documentation"
                            variant="brand-outline"
                            onclick={handleDocumentation}
                            disabled={isLoading}
                        ></lightning-button>
                        <template if:true={documentationResponse}>
                            <div class="summary-box full-width">
                                <p><strong>Summary:</strong> {documentationResponse.summary}</p>
                                <p><strong>Technical Summary:</strong> {documentationResponse.technicalSummary}</p>
                                <p><strong>Business Summary:</strong> {documentationResponse.businessSummary}</p>
                            </div>
                        </template>
                    </div>
                </lightning-tab>

                <lightning-tab label="Optimization Scanner Workspace" value="optimization">
                    <div class="tab-panel">
                        <lightning-button
                            label="Run Optimization Scan"
                            variant="brand-outline"
                            onclick={handleOptimization}
                            disabled={isLoading}
                        ></lightning-button>
                        <template if:true={optimizationResponse}>
                            <div class="summary-box">
                                <p><strong>Severity:</strong> {optimizationResponse.severity}</p>
                                <p><strong>Summary:</strong> {optimizationResponse.summary}</p>
                                <p><strong>Explanation:</strong> {optimizationResponse.explanation}</p>
                            </div>
                            <lightning-datatable
                                key-field="metadataKey"
                                data={optimizationResponse.findings}
                                columns={optimizationColumns}
                                hide-checkbox-column
                            ></lightning-datatable>
                        </template>
                    </div>
                </lightning-tab>

                <lightning-tab label="Admin Configuration Workspace" value="admin">
                    <div class="tab-panel">
                        <p>This workspace is ready for Prompt Builder assets, Agentforce topic mapping, sensitive field rules, and environment connection configuration.</p>
                        <ul class="admin-list">
                            <li>Configure `Agent_Action_Config__mdt` records for each action.</li>
                            <li>Configure `Sensitive_Field_Rule__mdt` for PHI and claims-sensitive fields.</li>
                            <li>Configure `Environment_Connection__mdt` for allowed compare targets.</li>
                            <li>Create Prompt Builder assets named in the implementation plan.</li>
                        </ul>
                    </div>
                </lightning-tab>
            </lightning-tabset>
        </div>
    </lightning-card>
</template>
